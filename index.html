function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=0.9;speechSynthesis.speak(u);}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let f=q?DATA.filter(x=>x.w.toLowerCase().includes(q)||x.t.includes(q)):DATA;
 document.getElementById('list').innerHTML=f.map((w,i)=>`
  <div class="card">
   <div class="num">#${i+1}</div>
   <div class="word">${w.w}</div>
   <div class="trans">${w.t}</div>
   <div class="de">${w.d}</div>
   <div class="ar">${w.a}</div>
   <button class="btn" onclick="speak('${w.d.replace(/'/g,'')}')">🔊 اسمع الجملة</button>
  </div>`).join('');
}
