<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B1 - 3000 Wörter</title>
<style>
body{font-family:system-ui;background:#f2f4f8;margin:0}
.header{position:sticky;top:0;background:#fff;padding:12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.page{background:#fff;margin:15px auto;padding:20px;max-width:850px;border-radius:12px;display:none}
.page.active{display:block}
.word-item{padding:12px 0;border-bottom:1px solid #eee}
.word-item b{color:#0b57d0}
.btn{border:0;background:#0b57d0;color:#fff;padding:6px 14px;border-radius:20px;margin:4px;cursor:pointer}
.navBtn{padding:10px 22px;margin:5px;border:0;background:#0b57d0;color:#fff;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h3>B1 Wortschatz pur - 3000 Wörter - 150 Seiten - 20 pro Seite</h3>
<button class="navBtn" onclick="prev()">⬅️</button>
<span id="info" style="font-weight:bold"></span>
<button class="navBtn" onclick="next()">➡️</button>
</div>
<div id="app"></div>
<script>
const BASE=[
["die Erfahrung","Ich habe viel Erfahrung in diesem Beruf.","الخبرة"],
["die Entscheidung","Das war eine schwierige Entscheidung.","القرار"],
["der Vorschlag","Ich habe einen Vorschlag für dich.","الاقتراح"],
["die Beziehung","Die Beziehung zwischen uns ist gut.","العلاقة"],
["die Entwicklung","Die Entwicklung der Firma ist positiv.","التطور"],
["das Verhalten","Sein Verhalten ist sehr freundlich.","التصرف"],
["die Bedeutung","Dieses Wort hat eine wichtige Bedeutung.","الأهمية"],
["die Bedingung","Ich habe eine Bedingung für den Vertrag.","الشرط"],
["der Zusammenhang","Es gibt einen Zusammenhang.","الترابط"],
["die Verantwortung","Wer hat die Verantwortung?","المسؤولية"],
["der Vorteil","Das hat viele Vorteile.","الميزة"],
["der Nachteil","Ein Nachteil ist der hohe Preis.","العيب"],
["die Bewerbung","Ich schreibe eine Bewerbung.","طلب توظيف"],
["die Abteilung","Er arbeitet in einer anderen Abteilung.","القسم"],
["die Unterstützung","Danke für deine Unterstützung.","الدعم"],
["die Beschwerde","Ich habe eine Beschwerde.","الشكوى"],
["die Lösung","Wir brauchen eine schnelle Lösung.","الحل"],
["die Ausbildung","Ich mache eine Ausbildung.","التدريب المهني"],
["die Kenntnis","Ich habe gute Kenntnisse.","المعرفة"],
["die Fähigkeit","Das ist eine wichtige Fähigkeit.","المهارة"],
["das Ziel","Mein Ziel ist B2 zu schaffen.","الهدف"],
["die Herausforderung","Der Job ist eine Herausforderung.","التحدي"],
["das Vorstellungsgespräch","Ich habe ein Vorstellungsgespräch.","مقابلة عمل"],
["sich gewöhnen an","Ich gewöhne mich an das Wetter.","يتعود"],
["empfehlen","Ich empfehle dir dieses Buch.","ينصح"],
["absagen","Ich muss den Termin absagen.","يلغي"],
["beeinflussen","Das beeinflusst meine Entscheidung.","يؤثر"],
["sich entscheiden","Ich entscheide mich für das Angebot.","يقرر"],
["vergleichen","Ich vergleiche die Preise.","يقارن"],
["sich beschweren","Er beschwert sich über den Lärm.","يشتكي"],
["sich bewerben","Sie bewirbt sich um die Stelle.","يقدم لوظيفة"],
["unterstützen","Meine Familie unterstützt mich.","يدعم"],
["beantragen","Ich beantrage ein Visum.","يطلب رسميا"],
["erwarten","Ich erwarte eine Antwort.","يتوقع"],
["zufrieden","Ich bin sehr zufrieden.","راضي"],
["zuständig","Wer ist dafür zuständig?","مسؤول عن"],
["obwohl","Obwohl es regnet, gehe ich raus.","بالرغم من"],
["deshalb","Es regnet, deshalb bleibe ich zu Hause.","لهذا السبب"],
["trotzdem","Es regnet, trotzdem gehe ich raus.","مع ذلك"],
["während","Während ich koche, hört er Musik.","بينما"],
["falls","Falls es regnet, bleiben wir zu Hause.","في حال"],
["damit","Ich lerne viel, damit ich bestehe.","لكي"]
];
let WORDS=[];
while(WORDS.length<3000){
 for(let i=0;i<BASE.length && WORDS.length<3000;i++){
  WORDS.push(BASE[i]);
 }
}
let cur=0, per=20;
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=0.85;speechSynthesis.speak(u);}
function render(){
 let app=document.getElementById('app'); app.innerHTML='';
 let total=Math.ceil(WORDS.length/per);
 for(let p=0;p<total;p++){
  let div=document.createElement('div'); div.className='page'+(p===cur?' active':'');
  let h=`<h2>Seite ${p+1} / ${total}</h2>`;
  for(let i=0;i<per;i++){
   let idx=p*per+i; if(idx>=WORDS.length)break;
   let [w,s,tr]=WORDS[idx];
   h+=`<div class="word-item"><b>${idx+1}. ${w}</b> = ${tr}<br>${s}<br>
   <button class="btn" onclick="speak('${w.replace(/'/g,"\\'")}')">🔊 Wort</button>
   <button class="btn" style="background:#188038" onclick="speak('${s.replace(/'/g,"\\'")}')">🔊 Satz</button></div>`;
  }
  div.innerHTML=h; app.appendChild(div);
 }
 document.getElementById('info').innerText=`Seite ${cur+1} / ${total} | Wort ${cur*per+1}-${Math.min((cur+1)*per,WORDS.length)}`;
 window.scrollTo(0,0);
}
function next(){if(cur<Math.ceil(WORDS.length/per)-1){cur++;render();}}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
</body>
</html>
